<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Editar</title>
</head>
<body>
    <main>
        <h2>Editar Livro</h2>

        <form action="{{ url_for('editar', id=livro[0] )}}" method="post">
            <label for="titulo">Titulo:</label>
            <input type="text" id="titulo" name="titulo" value="{{ livro[1] }}" required>

            <label for="autor">Autor:</label>
            <input type="text" id="autor" name="autor" value="" required>

            <label></label>
            <input type="" id="" name="" value="" required>
        </form>
    </main>
</body>
</html>
